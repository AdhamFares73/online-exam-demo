<div class="w-full">
  <button
    type="button"
    (click)="goBack()"
    aria-label="Go back"
    class="flex h-10 w-10 items-center justify-center border-2 border-gray-200 text-[#202B3A] transition hover:border-blue-500 hover:text-blue-600 hover:cursor-pointer"
  >
    <svg lucideMoveLeft></svg>
  </button>

  <div class="mt-14">
    <h1 class="mb-4 text-3xl font-bold tracking-tight text-gray-800">
      Password Reset Sent
    </h1>

    <div class="flex flex-col gap-4 font-normal text-base">
      <p class="text-gray-800">
        We have sent a password reset link to:
        <span class="text-blue-600">
          {{ email() }}
        </span>
      </p>

      <p class="text-gray-800">
        Please check your inbox and follow the instructions to reset your
        password.
      </p>

      <p class="text-sm text-gray-600">
        If you don’t see the email within a few minutes, check your spam or junk
        folder.
      </p>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-15 text-base text-gray-500">
    Don’t have an account?
    <a
      routerLink="/auth/register"
      class="font-medium text-blue-600 transition hover:cursor-pointer"
    >
      Create yours
    </a>
  </div>
</div>
