<form [formGroup]="infoForm" (ngSubmit)="submit()" class="space-y-3">
  <div>
    <h3 class="mb-2 text-2xl font-bold text-blue-600">
      Tell us more about you
    </h3>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <app-input
        forId="firstName"
        type="text"
        placeholder="Abdalla"
        labelName="First name"
        formControlName="firstName"
        [errorMessage]="getErrorMessage('firstName')"
        [mandatory]="true"
      />
    </div>

    <div>
      <app-input
        forId="lastName"
        type="text"
        placeholder="Ahmed"
        labelName="Last name"
        formControlName="lastName"
        [errorMessage]="getErrorMessage('lastName')"
        [mandatory]="true"
      />
    </div>
  </div>

  <div>
    <app-input
      forId="username"
      type="text"
      placeholder="user123"
      labelName="Username"
      formControlName="username"
      [errorMessage]="getErrorMessage('username')"
      [mandatory]="true"
    />
  </div>

  <div>
    <div class="w-full">
      <label
        for="phone"
        class="block mb-2 text-base font-medium text-[#1f2937]"
      >
        Phone
      </label>

      <div
        class="flex items-center w-full rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100"
        [class.border-red-600]="getErrorMessage('phone') !== ''"
      >
        <button
          type="button"
          class="flex items-center gap-2 px-3 py-3 border-gray-300 border-r-0 text-sm font-medium whitespace-nowrap hover:cursor-pointer"
        >
          <app-egy-flag />
          <span class="text-sm text-gray-950 font-medium">EG(+20)</span>
          <svg lucideChevronsUpDown style="height: 16px; width: 16px"></svg>
        </button>

        <input
          id="phone"
          type="tel"
          placeholder="01012345678"
          class="flex-1 min-w-0 px-3 py-3 outline-none rounded-r-lg"
          formControlName="phone"
        />
      </div>
      @if (getErrorMessage('phone') !== '') {
        <p class="text-sm text-red-500 mt-2">
          {{ getErrorMessage('phone') }}
        </p>
      }
    </div>
  </div>
  <div class="mt-9">
    <app-button
      [bgColor]="infoForm.invalid ? '#DCDFE3' : '#eff6ff'"
      textColor="#000"
      value="Next"
      [showArrow]="true"
      [isDisabled]="infoForm.invalid"
    />
  </div>
</form>
