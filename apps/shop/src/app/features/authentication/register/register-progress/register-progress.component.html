<div class="flex items-center w-full mb-7">
  @for (step of steps; track step) {
    <div class="relative grid h-5 w-5 shrink-0 place-items-center">
      @if (step === currentStep) {
        <span
          class="absolute inset-0 rotate-45 bg-blue-100 transition-all duration-300"
        ></span>
      }

      <span
        class="relative z-10 h-[10px] w-[10px] rotate-45 transition-all duration-300"
        [class.bg-[#165DFF]]="step <= currentStep"
        [class.bg-white]="step > currentStep"
        [class.border-2]="step > currentStep"
        [class.border-[#165DFF]]="step > currentStep"
      ></span>
    </div>
    @if (step !== 4) {
      <div
        class="flex-1 h-px transition-all duration-300"
        [class.bg-[#165DFF]]="step < currentStep"
        [class.border-t]="step >= currentStep"
        [class.border-dashed]="step >= currentStep"
        [class.border-[#165DFF]]="step >= currentStep"
      ></div>
    }
  }
</div>
