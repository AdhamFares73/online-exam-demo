@let current = this.state();
<p-toast />
<div class="space-y-6">
  <div>
    <h3 class="mb-3 text-2xl font-bold text-[#155DFC]">Verify OTP</h3>

    <p class="text-sm text-gray-500">
      Please enter the 6-digits code we have sent to:
      <span class="font-medium text-gray-800"
        >{{ email }}.
        <button
          (click)="editEmail()"
          class="text-blue-600 underline text-base font-medium hover:cursor-pointer"
        >
          Edit
        </button></span
      >
    </p>
  </div>
  <form [formGroup]="otpForm" (ngSubmit)="sendOtp()" class="space-y-2">
    <label for="otp" class="block text-sm font-medium text-gray-700">
      Verification Code
    </label>

    <div class="flex flex-col justify-center items-center gap-6">
      <p-inputOtp formControlName="code" [integerOnly]="true" [length]="6" />
      <p class="text-gray-500 text-sm">
        You can request another code in: {{ counter() }}s
      </p>
    </div>
    @if (otpForm.get('code')?.touched && otpForm.get('code')?.invalid) {
      <p class="text-sm text-red-500">
        Please enter a valid 6-digit verification code.
      </p>
    }

    <div class="mt-9">
      <app-button
        [bgColor]="otpForm.invalid ? '#DCDFE3' : '#eff6ff'"
        textColor="#000"
        value="Verify Code"
        [showSpinner]="current.status === 'loading' ? true : false"
        [isDisabled]="otpForm.invalid"
      />
    </div>
  </form>
</div>
