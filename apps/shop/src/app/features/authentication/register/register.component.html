<div class="w-full font-mono">
  <!-- Progress -->
  @if (showProgress()) {
    <app-register-progress [currentStep]="currentStep() + 1" />
  }
  <h2 class="text-3xl font-bold text-[#202B3A] mb-2.5">Create Account</h2>

  @switch (currentStep()) {
    @case (0) {
      <app-register-email [emailGroup]="emailForm" (emailSent)="next()" />
    }

    @case (1) {
      <app-register-otp
        [email]="emailForm.get('email')?.value ?? ''"
        (back)="previous()"
        (codeSent)="next()"
      />
    }

    @case (2) {
      <app-register-info [infoForm]="infoForm" (nextStep)="next()" />
    }

    @case (3) {
      <app-register-password
        [passwordForm]="passwordForm"
        (nextStep)="next()"
      />
    }

    @case (4) {
      <div class="py-10 text-center">
        <h3 class="text-2xl font-bold text-green-600">
          Account Created Successfully!
        </h3>
      </div>
    }
  }

  <!-- @if (currentStep() === 3) {

  } -->
  @if (currentStep() === 0) {
    <div class="footer-register">
      <p class="register">
        Already have an account ?
        <a routerLink="/auth/login">Login</a>
      </p>
    </div>
  }
</div>
