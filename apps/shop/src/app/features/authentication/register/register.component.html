<div class="w-full font-mono">
  @let current = this.state();
  <p-toast />
  @if (showProgress()) {
    <app-register-progress [currentStep]="currentStep() + 1" />
  }
  <h2 class="text-3xl font-bold text-[#202B3A] mb-2.5">Create Account</h2>

  @switch (currentStep()) {
    @case (0) {
      <app-register-email [emailGroup]="emailForm" (emailSent)="next()" />
    }

    @case (1) {
      <app-register-otp
        [email]="emailForm.get('email')?.value ?? ''"
        (back)="previous()"
        (codeSent)="next()"
      />
    }

    @case (2) {
      <app-register-info [infoForm]="infoForm" (nextStep)="next()" />
    }

    @case (3) {
      <app-register-password
        [passwordForm]="passwordForm"
        (nextStep)="next()"
        [loading]="current.status === 'loading' ? true : false"
      />
    }
  }
</div>
