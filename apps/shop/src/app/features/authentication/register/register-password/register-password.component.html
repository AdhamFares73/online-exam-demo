<form [formGroup]="passwordForm" (ngSubmit)="submit()" class="space-y-6">
  <div>
    <h3 class="text-2xl font-bold text-blue-600">Create a strong password</h3>
  </div>

  <div class="space-y-2">
    <app-input
      forId="password"
      type="password"
      placeholder="Enter Password"
      labelName="Password"
      formControlName="password"
      [errorMessage]="getErrorMessage('password')"
      [mandatory]="true"
    />
  </div>

  <div class="space-y-2">
    <app-input
      forId="confirmPassword"
      type="password"
      placeholder="Enter confirmPassword"
      labelName="Confirm Password"
      formControlName="confirmPassword"
      [errorMessage]="
        passwordForm.get('confirmPassword')?.touched &&
        passwordForm.getError('passwordMismatch')
          ? 'Passwords do not match.'
          : getErrorMessage('confirmPassword')
      "
      [mandatory]="true"
    />
  </div>
  <div class="button">
    <app-button
      [bgColor]="passwordForm.invalid ? '#1B449E' : '#155dfc'"
      textColor="#fff"
      value="Create Account"
      [showSpinner]="loading"
      [isDisabled]="passwordForm.invalid"
    />
  </div>
</form>
