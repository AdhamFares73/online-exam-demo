<div [formGroup]="passwordForm" class="space-y-6">
  <div>
    <h3 class="text-2xl font-bold text-blue-600">Create a strong password</h3>
  </div>

  <div class="space-y-2">
    <!-- <label for="password" class="text-sm font-medium text-gray-700">
      Password
    </label>

    <input
      id="password"
      type="password"
      formControlName="password"
      placeholder="Enter password"
      class="w-full border border-gray-300 px-4 py-4 outline-none focus:border-[#165DFF]"
    /> -->

    <app-input
      forId="password"
      type="password"
      placeholder="Enter Password"
      labelName="Password"
      formControlName="password"
    />
  </div>

  <div class="space-y-2">
    <app-input
      forId="confirmPassword"
      type="password"
      placeholder="Enter confirmPassword"
      labelName="Confirm Password"
      formControlName="confirmPassword"
    />
    @if (
      passwordForm.hasError('passwordMismatch') &&
      passwordForm.get('confirmPassword')?.touched
    ) {
      <p class="text-sm text-red-500">Passwords do not match.</p>
    }
  </div>
</div>
