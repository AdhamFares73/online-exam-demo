<form class="space-y-6" [formGroup]="emailGroup" (ngSubmit)="submit()">
  <div class="space-y-2">
    <app-input
      forId="email"
      type="email"
      placeholder="user@example.com"
      labelName="Email"
      formControlName="email"
    />
    @if (
      emailGroup.get('email')?.touched &&
      emailGroup.get('email')?.hasError('required')
    ) {
      <p class="text-sm text-red-500">Email is required.</p>
    }

    @if (
      emailGroup.get('email')?.touched &&
      emailGroup.get('email')?.hasError('email')
    ) {
      <p class="text-sm text-red-500">Enter a valid email address.</p>
    }
    <div class="mt-8">
      <app-button
        bgColor="#eff6ff"
        textColor="#000"
        value="Next"
        [showArrow]="true"
      />
    </div>
  </div>
</form>
<div class="text-center mt-8">
  <p class="text-gray-500 text-sm font-medium">
    Already have an account?
    <a class="text-blue-600 hover:cursor-pointer" routerLink="/auth/login"
      >Login</a
    >
  </p>
</div>
