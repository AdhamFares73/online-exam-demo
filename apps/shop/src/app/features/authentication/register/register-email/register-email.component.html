    <app-input
      forId="email"
      type="email"
      placeholder="user@example.com"
      labelName="Email"
      [formControl]="emailControl"
    />
    @if (emailControl.touched && emailControl.hasError('required')) {
      <p class="text-sm text-red-500">Email is required.</p>
    }

    @if (emailControl.touched && emailControl.hasError('email')) {
      <p class="text-sm text-red-500">Enter a valid email address.</p>
    }
  </div>
</div>
