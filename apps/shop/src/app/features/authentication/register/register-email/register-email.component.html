<form class="space-y-6" [formGroup]="emailGroup" (ngSubmit)="sendEmail()">
  @let current = this.state();
  <div class="space-y-2">
    <app-input
      forId="email"
      type="email"
      placeholder="user@example.com"
      labelName="Email"
      formControlName="email"
      [errorMessage]="getErrorMessage('email')"
    />
    @if (current.status === 'error') {
      <p class="text-sm text-red-500">
        {{ current.message }}
      </p>
    }
    <div class="mt-8">
      <app-button
        [bgColor]="emailGroup.invalid ? '#DCDFE3' : '#eff6ff'"
        textColor="#1F2937"
        value="Next"
        [showArrow]="true"
        [showSpinner]="current.status === 'loading' ? true : false"
        [isDisabled]="emailGroup.invalid"
      />
    </div>
  </div>
</form>
<div class="text-center mt-8">
  <p class="text-gray-500 text-sm font-medium">
    Already have an account?
    <a class="text-blue-600 hover:cursor-pointer" routerLink="/auth/login"
      >Login</a
    >
  </p>
</div>
