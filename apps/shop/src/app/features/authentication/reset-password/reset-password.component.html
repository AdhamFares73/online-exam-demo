<form [formGroup]="passwordForm" (ngSubmit)="submit()" class="space-y-6">
  <div class="flex flex-col gap-2.5 mb-4">
    <h3 class="text-3xl font-bold text-gray-800">Create a New Password</h3>
    <p class="text-gray-500 text-base font-normal">
      Create a new strong password for your account
    </p>
  </div>

  <div class="space-y-2">
    <app-input
      forId="password"
      type="password"
      placeholder="Enter Password"
      labelName="Password"
      formControlName="newPassword"
    />
  </div>

  <div class="space-y-2">
    <app-input
      forId="confirmPassword"
      type="password"
      placeholder="Enter confirmPassword"
      labelName="Confirm Password"
      formControlName="confirmPassword"
    />
    @if (
      passwordForm.hasError('passwordMismatch') &&
      passwordForm.get('confirmPassword')?.touched
    ) {
      <p class="text-sm text-red-500">Passwords do not match.</p>
    }
  </div>
  <div class="footer">
    <app-button [value]="'Reset Password'" bgColor="#155dfc" />
    <div class="footer-register">
      <p class="register">
        Don’t have an account?
        <a routerLink="/auth/register">Create yours</a>
      </p>
    </div>
  </div>
</form>
