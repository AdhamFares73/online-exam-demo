<div class="w-full">
  <div class="mb-6">
    <h2 class="text-3xl font-bold text-[#202B3A] mb-2.5">Forgot Password</h2>
    <p class="text-base font-normal text-gray-500 font-mono">
      Don’t worry, we will help you recover your account.
    </p>
  </div>
  <form [formGroup]="emailForm" (ngSubmit)="submit()">
    <app-input
      forId="email"
      type="email"
      placeholder="user@example.com"
      labelName="Email"
      formControlName="email"
    />
    @if (emailControl.touched && emailControl.hasError('required')) {
      <p class="text-sm text-red-500">Email is required.</p>
    }

    @if (emailControl.touched && emailControl.hasError('email')) {
      <p class="text-sm text-red-500">Enter a valid email address.</p>
    }
    <div class="footer">
      <app-button [value]="'Next'" bgColor="#155dfc" [showArrow]="true" />
      <div class="footer-register">
        <p class="register">
          Don’t have an account?
          <a routerLink="/auth/register">Create yours</a>
        </p>
      </div>
    </div>
  </form>
</div>
