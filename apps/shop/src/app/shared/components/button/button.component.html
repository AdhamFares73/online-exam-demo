<button
  class="btn"
  [style.backgroundColor]="bgColor"
  [style.color]="textColor"
  (click)="clicked($event)"
  [disabled]="isDisabled"
>
  @if (showSpinner) {
    <p-progressSpinner ariaLabel="loading" />
  } @else {
    <span>
      {{ value }}
      @if (showArrow) {
        <svg lucideChevronRight></svg>
      }
    </span>
  }
</button>
