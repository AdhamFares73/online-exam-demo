<div class="form-group">
  <label [for]="forId" class="label">
    {{ labelName }}
    @if (mandatory) {
      <span class="text-red-700">*</span>
    }
  </label>

  <div class="relative">
    <input
      [id]="forId"
      [type]="isPasswordVisible ? 'text' : type"
      [placeholder]="placeholder"
      [required]="mandatory"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [value]="inputValue"
      class="h-11 p-2.5 border border-gray-300 w-full focus:outline-none focus:ring-2 focus:ring-blue-100"
      [class.pr-10]="type === 'password'"
      [class.border-red-600]="errorMessage !== ''"
    />

    @if (type === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
        [attr.aria-label]="
          isPasswordVisible ? 'Hide password' : 'Show password'
        "
      >
        @if (isPasswordVisible) {
          <svg lucideEye></svg>
        } @else {
          <svg lucideEyeOff></svg>
        }
      </button>
    }
  </div>

  @if (errorMessage !== '') {
    <p class="text-sm text-red-500">
      {{ errorMessage }}
    </p>
  }
</div>
